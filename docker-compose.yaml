services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      - MODEL=${MODEL:-grok-4-fast-reasoning}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-xai}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - FINANCIAL_DATA_PROVIDER=${FINANCIAL_DATA_PROVIDER:-}
      - FINANCIAL_DATASETS_API_KEY=${FINANCIAL_DATASETS_API_KEY:-}
      - MASSIVE_API_KEY=${MASSIVE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - POLYMARKET_WALLET_PRIVATE_KEY=${POLYMARKET_WALLET_PRIVATE_KEY:-}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-}
      - TOMORROWIO_API_KEY=${TOMORROWIO_API_KEY:-}
      - VISUAL_CROSSING_API_KEY=${VISUAL_CROSSING_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - POLYCODE_DB_URL=${POLYCODE_DB_URL:-}
      - CHAT_REQUIRE_DATABASE=${CHAT_REQUIRE_DATABASE:-true}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ISSUER=${JWT_ISSUER:-polytrade}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-polytrade-api}
      - ASSETHERO_CLIENT_ID=${ASSETHERO_CLIENT_ID:-}
      - ASSETHERO_CLIENT_SECRET=${ASSETHERO_CLIENT_SECRET:-}
      - ASSETHERO_SERVICE_USER_ID=${ASSETHERO_SERVICE_USER_ID:-}
      - SERVICE_TOKEN_TTL_SECONDS=${SERVICE_TOKEN_TTL_SECONDS:-900}
      - SERVICE_AUTH_RATE_LIMIT_PER_MINUTE=${SERVICE_AUTH_RATE_LIMIT_PER_MINUTE:-10}
      - SERVICE_CHAT_RATE_LIMIT_PER_MINUTE=${SERVICE_CHAT_RATE_LIMIT_PER_MINUTE:-120}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4002,http://localhost:4003}
      - CHAT_MAX_MESSAGE_CHARS=${CHAT_MAX_MESSAGE_CHARS:-20000}
      - CHAT_MAX_HISTORY_MESSAGES=${CHAT_MAX_HISTORY_MESSAGES:-50}
      - CHAT_MAX_CONCURRENT_RUNS=${CHAT_MAX_CONCURRENT_RUNS:-8}
      - CHAT_RUN_TIMEOUT_SECONDS=${CHAT_RUN_TIMEOUT_SECONDS:-300}
      - CHAT_STALE_RUN_SECONDS=${CHAT_STALE_RUN_SECONDS:-600}
      - CHAT_RATE_LIMIT_PER_MINUTE=${CHAT_RATE_LIMIT_PER_MINUTE:-30}
      - AUTH_RATE_LIMIT_PER_MINUTE=${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      - CHAT_SSE_HEARTBEAT_SECONDS=${CHAT_SSE_HEARTBEAT_SECONDS:-15}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:4000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.fasthtml
    ports:
      - "4002:4002"
    environment:
      - MODEL=${MODEL:-grok-4-fast-reasoning}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-xai}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - FINANCIAL_DATA_PROVIDER=${FINANCIAL_DATA_PROVIDER:-}
      - FINANCIAL_DATASETS_API_KEY=${FINANCIAL_DATASETS_API_KEY:-}
      - MASSIVE_API_KEY=${MASSIVE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - POLYMARKET_WALLET_PRIVATE_KEY=${POLYMARKET_WALLET_PRIVATE_KEY:-}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-}
      - TOMORROWIO_API_KEY=${TOMORROWIO_API_KEY:-}
      - VISUAL_CROSSING_API_KEY=${VISUAL_CROSSING_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - POLYCODE_DB_URL=${POLYCODE_DB_URL:-}
      - CHAT_REQUIRE_DATABASE=${CHAT_REQUIRE_DATABASE:-true}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:4002/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  agui:
    build:
      context: .
      dockerfile: Dockerfile.agui
    ports:
      - "4003:4003"
    environment:
      - MODEL=${MODEL:-grok-4-fast-reasoning}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-xai}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - FINANCIAL_DATA_PROVIDER=${FINANCIAL_DATA_PROVIDER:-}
      - FINANCIAL_DATASETS_API_KEY=${FINANCIAL_DATASETS_API_KEY:-}
      - MASSIVE_API_KEY=${MASSIVE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - POLYMARKET_WALLET_PRIVATE_KEY=${POLYMARKET_WALLET_PRIVATE_KEY:-}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-}
      - TOMORROWIO_API_KEY=${TOMORROWIO_API_KEY:-}
      - VISUAL_CROSSING_API_KEY=${VISUAL_CROSSING_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - POLYCODE_DB_URL=${POLYCODE_DB_URL:-}
      - CHAT_REQUIRE_DATABASE=${CHAT_REQUIRE_DATABASE:-true}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CHAT_MAX_MESSAGE_CHARS=${CHAT_MAX_MESSAGE_CHARS:-20000}
      - CHAT_MAX_HISTORY_MESSAGES=${CHAT_MAX_HISTORY_MESSAGES:-50}
      - CHAT_MAX_CONCURRENT_RUNS=${CHAT_MAX_CONCURRENT_RUNS:-8}
      - CHAT_RUN_TIMEOUT_SECONDS=${CHAT_RUN_TIMEOUT_SECONDS:-300}
      - CHAT_STALE_RUN_SECONDS=${CHAT_STALE_RUN_SECONDS:-600}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:4003/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
